apiVersion: v1
kind: Secret
type: Opaque

metadata:
  name: openshift-ipi-gcp-service-account
  namespace: default

data:
  google-credentials.json: |-
    {{ required ".Values.openshift_4__gcp_service_account_key_json is undefined" .Values.openshift_4__gcp_service_account_key_json }}

---
# (deprecated) this secret was renamed to openshift-ipi-gcp-service-account.
# Workflows created before the rename reference the old name in their stored
# specs and can remain suspended at their wait step across the upgrade; without
# this secret their destroy step cannot run. It can be removed once no
# workflows created before the rename are left.
apiVersion: v1
kind: Secret
type: Opaque

metadata:
  name: openshift-4-gcp-service-account
  namespace: default

data:
  google-credentials.json: |-
    {{ required ".Values.openshift_4__gcp_service_account_key_json is undefined" .Values.openshift_4__gcp_service_account_key_json }}

---

apiVersion: v1
kind: Secret
type: Opaque

metadata:
  name: redhat-pull-secret
  namespace: default

data:
  REDHAT_PULL_SECRET: |-
    {{ required ".Values.openshift_4__redhat_pull_secret_json is undefined" .Values.openshift_4__redhat_pull_secret_json }}

---

# Workflows run in namespace default and mount this for the VM containerDisk
# pull. The infra-namespace copy is the server's imagePullSecret.
apiVersion: v1
kind: Secret
type: kubernetes.io/dockerconfigjson

metadata:
  name: infra-image-registry-pull-secret
  namespace: default

data:
  .dockerconfigjson: {{ template "pull-secret" .Values.pullSecrets.quay }}
