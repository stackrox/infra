apiVersion: v1
kind: Secret
type: Opaque

metadata:
  name: openshift-ipi-gcp-service-account
  namespace: default

data:
  google-credentials.json: |-
    {{ required ".Values.openshift_4__gcp_service_account_key_json is undefined" .Values.openshift_4__gcp_service_account_key_json }}

---

apiVersion: v1
kind: Secret
type: Opaque

metadata:
  name: redhat-pull-secret
  namespace: default

data:
  REDHAT_PULL_SECRET: |-
    {{ required ".Values.openshift_4__redhat_pull_secret_json is undefined" .Values.openshift_4__redhat_pull_secret_json }}

---

# Workflows run in namespace default and mount this for the VM containerDisk
# pull. The infra-namespace copy is the server's imagePullSecret.
apiVersion: v1
kind: Secret
type: kubernetes.io/dockerconfigjson

metadata:
  name: infra-image-registry-pull-secret
  namespace: default

data:
  .dockerconfigjson: {{ template "pull-secret" .Values.pullSecrets.quay }}
