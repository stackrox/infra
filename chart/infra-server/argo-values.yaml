argo-workflows:
  namespaceOverride: argo
  server:
    authModes:
      - server
  # We install the CRDs separately, because they cannot be upgraded with Helm through the dependant chart.
  crds:
    install: false

  controller:
    # Default values that will apply to all Workflows from this controller, unless overridden on the Workflow-level
    workflowDefaults:
      metadata:
        annotations:
          argo: workflows
      spec:
        ttlStrategy:
          # Delete workflows (with their pods and PVCs) 48h after completion.
          # Main-container logs are archived in the artifact repository
          # (archiveLogs saves the main container only); wait and sidecar
          # container logs are not archived and are removed with the pod.
          secondsAfterCompletion: 172800

  artifactRepository:
    archiveLogs: true
    gcs:
      bucket: rhacs-infra-artifacts
      serviceAccountKeySecret:
        name: gcs-credentials
        key: credentials.json
